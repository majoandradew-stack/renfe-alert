
name: Alerta Renfe Toledo Madrid

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: renfe-monitor
  cancel-in-progress: false

jobs:
  comprobar-plazas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Consultar Renfe
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Guardar estado
        run: |
          if [ -f state.json ]; then
            git config user.name "renfe-alert-bot"
            git config user.email "renfe-alert-bot@users.noreply.github.com"
            git add state.json

            if ! git diff --cached --quiet; then
              git commit -m "Actualizar disponibilidad"
              git pull --rebase origin master
              git push origin HEAD:master
            fi
          fi
